name: DB7 window and stride diagnostics
run-name: DB7 diagnostics (${{ inputs.scope }})
on:
  workflow_dispatch:
    inputs:
      scope:
        description: All configurations after preflight, or preflight only
        type: choice
        options: [all, smoke]
        default: all
permissions:
  contents: read
concurrency:
  group: db7-kaggle-experiments
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Run and validate all nine configurations on S1 (two epochs)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          DIAGNOSTIC_JOB: smoke
        run: python scripts/run_diagnostic_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          path: |
            diagnostic_results/
            diagnostic_submitted/
          retention-days: 14
          compression-level: 0
  window200:
    needs: preflight
    if: inputs.scope == 'all'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stride: [50, 100, 200]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Run and validate 200 ms window, all 22 subjects
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          DIAGNOSTIC_JOB: w200-s${{ matrix.stride }}
        run: python scripts/run_diagnostic_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-w200-s${{ matrix.stride }}
          path: |
            diagnostic_results/
            diagnostic_submitted/
          retention-days: 14
          compression-level: 0
  window400:
    needs: window200
    if: inputs.scope == 'all'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stride: [50, 100, 200]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Run and validate 400 ms window, all 22 subjects
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          DIAGNOSTIC_JOB: w400-s${{ matrix.stride }}
        run: python scripts/run_diagnostic_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-w400-s${{ matrix.stride }}
          path: |
            diagnostic_results/
            diagnostic_submitted/
          retention-days: 14
          compression-level: 0
  window600:
    needs: window400
    if: inputs.scope == 'all'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stride: [50, 100, 200]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Run and validate 600 ms window, all 22 subjects
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          DIAGNOSTIC_JOB: w600-s${{ matrix.stride }}
        run: python scripts/run_diagnostic_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-w600-s${{ matrix.stride }}
          path: |
            diagnostic_results/
            diagnostic_submitted/
          retention-days: 14
          compression-level: 0
