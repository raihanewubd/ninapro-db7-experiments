name: DB7-030 Hudgins TD4 complementarity

on:
  workflow_dispatch:
    inputs:
      monitor_ref:
        description: Existing Kaggle notebook reference; leave blank to submit once
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db7-030-hudgins
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Submit CPU notebook and verify output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_SECONDARY }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME_SECONDARY }}
          KAGGLE_MONITOR_REF: ${{ inputs.monitor_ref }}
        run: python run_db7_030_hudgins.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db7-030-results-${{ github.run_id }}
          path: |
            db7_030_action_results/
          retention-days: 30
          compression-level: 0
