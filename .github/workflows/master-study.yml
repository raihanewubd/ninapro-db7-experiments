name: DB7 four-stage master study
run-name: DB7 master study (${{ inputs.scope }})
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Preflight followed by the full study, or preflight only
        type: choice
        options: [all, smoke]
        default: all
permissions:
  contents: read
concurrency:
  group: db7-kaggle-experiments
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Validate every stage on a small GPU run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          MASTER_JOB: smoke
        run: python scripts/run_master.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-master-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          path: |
            master_results/
            master_submitted/
          retention-days: 14
          compression-level: 0
  study:
    needs: preflight
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [windows, cross1, cross2, cross3, cross4, cross5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Run master notebook stage
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          MASTER_JOB: ${{ matrix.stage }}
        run: python scripts/run_master.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-master-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stage }}
          path: |
            master_results/
            master_submitted/
          retention-days: 14
          compression-level: 0
