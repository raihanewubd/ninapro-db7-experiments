name: DB7-032 JOPS hierarchical Hudgins BRB
on:
  workflow_dispatch:
    inputs:
      monitor_ref:
        description: Existing beautifulminnd/db7-032-jops-RUN_ID to monitor; blank submits once
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: db7-032-jops
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: |
          python -m pip install kaggle==2.2.4 numpy pandas scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify JOPS membership, ER and constrained DE optimization
        run: python scripts/db7_032_jops_engine.py --self-test
      - name: Verify structure proposals, componentwise Pareto archive and selection
        run: python scripts/db7_032_jops.py --self-test
      - name: Submit dual GPU Kaggle JOPS and verify results
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_SECONDARY }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME_SECONDARY }}
          KAGGLE_MONITOR_REF: ${{ inputs.monitor_ref }}
        run: python run_db7_032_jops.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db7-032-results-${{ github.run_id }}
          path: db7_032_action_results/
          retention-days: 30
          compression-level: 0
