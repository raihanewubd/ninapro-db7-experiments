name: DB7-020 Branch-specific BRB reliability
on:
  workflow_dispatch:
    inputs:
      monitor_ref:
        description: Existing Kaggle reference to monitor; blank submits one CPU audit
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: db7-020-branch-reliability
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Submit CPU notebook and verify output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_SECONDARY }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME_SECONDARY }}
          KAGGLE_MONITOR_REF: ${{ inputs.monitor_ref }}
        run: python run_db7_020_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db7-020-recovery-${{ github.run_id }}
          path: |
            audit_results/
            audit_submission/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: db7-020-summary
          path: audit_results/summary/
          retention-days: 30
