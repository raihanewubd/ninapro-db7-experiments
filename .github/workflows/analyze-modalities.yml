name: Analyze saved DB7 modalities
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas numpy matplotlib tabulate
      - name: Analyze existing predictions without retraining
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/analyze_modality_results.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-modality-analysis-34582518772
          path: modality_analysis/
          retention-days: 14
