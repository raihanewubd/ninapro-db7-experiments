name: DB7 sensor modality screen
run-name: DB7 modality screen (${{ inputs.scope }})
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Seven sensor combinations after GPU preflight
        type: choice
        options: [all, smoke]
        default: all
permissions:
  contents: read
concurrency:
  group: db7-kaggle-experiments
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Check all seven inputs on S1 for two epochs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          MODALITY_JOB: smoke
        run: python scripts/run_modality_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-modalities-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          path: |
            modality_results/
            modality_submitted/
          retention-days: 14
          compression-level: 0
  full:
    needs: preflight
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [emg, acc, gyroscope, magnetometer, emg_acc, emg_acc_gyroscope, emg_acc_magnetometer]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Train and collect 22 subjects
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          MODALITY_JOB: ${{ matrix.arm }}
        run: python scripts/run_modality_study.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-modalities-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: |
            modality_results/
            modality_submitted/
          retention-days: 14
          compression-level: 0
