name: DB7 early-window energy experiment
run-name: DB7 C1 vs amplitude vs energy-change (${{ inputs.scope }})

on:
  workflow_dispatch:
    inputs:
      scope:
        description: GPU preflight, then paired models for all 22 subjects and three seeds
        type: choice
        options: [all, smoke]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: db7-kaggle-experiments
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Check all three models on S1 and S22 for two epochs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          ENERGY_JOB: smoke
        run: python scripts/run_energy_kaggle.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-energy-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          path: |
            energy_results/
            energy_submitted/
          retention-days: 14
          compression-level: 0

  full:
    needs: preflight
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.4
      - name: Train C1, C2A and C2D for all 22 subjects, then verify and collect outputs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          ENERGY_JOB: seed${{ matrix.seed }}
        run: python scripts/run_energy_kaggle.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-energy-${{ github.run_id }}-${{ github.run_attempt }}-seed${{ matrix.seed }}
          path: |
            energy_results/
            energy_submitted/
          retention-days: 14
          compression-level: 0

  analyze:
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis dependencies on the GitHub runner
        run: python -m pip install numpy pandas matplotlib tabulate
      - name: Download only full seed artifacts, verify identities, and analyze paired results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_energy_kaggle.py --collect-analysis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db7-energy-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            energy_analysis/
            collectedruns/collection_verification.json
          retention-days: 14
