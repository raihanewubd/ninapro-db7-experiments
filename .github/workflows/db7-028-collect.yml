name: Recover DB7-028 existing output
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db7-028-output-recovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62334fb121e26dd6d41444db029f5c2868749621
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install kaggle==2.2.4
      - name: Retrieve and verify existing output only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_SECONDARY }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME_SECONDARY }}
        run: |
          for delay in 0 120 300; do
            sleep "$delay"
            if python run_db7_suite.py --stage 7 --monitor-ref beautifulminnd/db7-028-35829795169; then
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db7-028-recovered-results
          path: suite_results/
          retention-days: 30
          compression-level: 0
